services:
  - type: web
    name: smartresto-api
    runtime: node
    plan: free
    buildCommand: npm install --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: CLIENT_URL
        fromService:
          type: web
          name: smartresto-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: smartresto-web
    runtime: static
    buildCommand: npm install && npm install --prefix client && npm run build --prefix client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smartresto-api
          envVarKey: RENDER_EXTERNAL_URL
